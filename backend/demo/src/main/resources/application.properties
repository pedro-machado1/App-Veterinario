#Database
spring.application.name=backend
server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto= update
spring.jpa.open-in-view=false

#Token
api.security.token.access = ${JWT_ACCESS_SECRET}
api.security.token.refresh = ${JWT_REFRESH_SECRET}
api.security.token.reset = ${JWT_RESET_SECRET}
api.security.token.veterinario = ${JWT_VERIFICATION_SECRET}
api.security.token.verification = ${JWT_VETERINARIO_SECRET}

# email
spring.mail.host= smtp.gmail.com
spring.mail.port= 587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# armazenamento de imagens

file.path=/app/imagens
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

